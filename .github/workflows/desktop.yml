name: "Desktop sayt yigish"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "scripts/**"
      - "capacitor.config.json"
      - "package.json"
      - ".github/workflows/apk.yml"
      - "electron/**"
      - ".github/workflows/exe.yml"
      - "README.md"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install pillow
      - run: python3 desktop/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
