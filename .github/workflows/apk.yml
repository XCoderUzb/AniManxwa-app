name: "APK yigish"
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - run: python3 scripts/patch_android.py
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: APK nomini tayyorlash
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AniManxwa.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AniManxwa-apk
          path: AniManxwa.apk
      - name: Release yangilash (doimiy havola)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android --yes --cleanup-tag || true
          gh release create android AniManxwa.apk --latest=false --title "AniManxwa Android" --notes "Android: AniManxwa.apk. Build #${{ github.run_number }}"
