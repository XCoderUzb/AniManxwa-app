name: "APK yigish"
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fayllarni joylash va tekshirish
        run: |
          mkdir -p www scripts
          for f in index.html style.css app.js; do
            if [ -f "$f" ]; then mv -f "$f" www/; fi
          done
          if [ -f patch_android.py ]; then mv -f patch_android.py scripts/; fi
          for f in package.json capacitor.config.json www/index.html www/style.css www/app.js scripts/patch_android.py; do
            if [ ! -f "$f" ]; then echo "::error::Yo'q fayl: $f"; exit 1; fi
          done
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - run: python3 scripts/patch_android.py
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AniManxwa-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
