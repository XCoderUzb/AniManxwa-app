<!doctype html><html><head><meta charset="utf-8"><title>AniManxwa</title>
<script>
/* sayt/manhwa/nom/3 kabi havolalarni ilovaga (#/manhwa/nom/3) yo'naltiradi */
(function(){
  var p=location.pathname.split("/").filter(Boolean),
      i=p.findIndex(function(x){return /^(manga|manhwa|manhua|novella)$/i.test(x)}),
      pre=location.hostname.slice(-10)==="github.io"&&p.length?"/"+p[0]+"/":"/";
  if(i>=0){pre=i?"/"+p.slice(0,i).join("/")+"/":"/";location.replace(pre+"#/"+p.slice(i).join("/"))}
  else location.replace(pre);
})();
</script></head><body style="background:#000"></body></html>
